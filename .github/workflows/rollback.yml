name: Rollback to Experiment Tag

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to roll back to (e.g. exp-qlearning-1)'
        required: true

jobs:
  rollback:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          ref: ${{ github.event.inputs.tag }}
      - name: Confirm rollback state
        run: git log --oneline -5